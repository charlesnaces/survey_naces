<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Name
		<input id='name' type='text'>
		Bloodtype
		<input id='bloodtype' type='text'>
		Are you diabetic?
		<input id='diabetic' type='text'>
		Do you have Std?
		<input id='std' type='text'>
		Do you drink water 8 glasses a day?
		<input id='drink' type='text'>
		Last blood donation date
		<input id='date' type='text'>
		Are you willing to donate blood?
		<input id='blood' type='text'>
		Do you have anemia?
		<input id='anemia' type='text'>
		Are you open minded?
		<input id='open' type='text'>
		Can i go inside your house?
		<input id='permission' type='text'>


		<button type="button" onclick="clickButton( 
		document.getElementById('name').value,
		document.getElementById('bloodtype').value,
		document.getElementById('diabetic').value, 
		document.getElementById('std').value,
		document.getElementById('drink').value, 
		document.getElementById('date').value,
		document.getElementById('blood').value, 
		document.getElementById('anemia').value,
		document.getElementById('open').value, 
		document.getElementById('permission').value)">Click Me!</button>

		<script>



		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				name:a,
				bloodtype:b,
				diabetic:c,
				std:d,
				drink:e,
				date:f,
				blood:g,
				anemia:h,
				open:i,
				permission:j
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/survey',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
